<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Serviços</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 40px auto; padding: 20px; background: #e3f2fd; }
        .caixa { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #1565c0; text-align: center; }
        button { padding: 12px 24px; margin: 8px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); }
        .voltar { background: #90caf9; }
        .contato { background: #4caf50; color: white; }
    </style>
</head>
<body>

    <div class="caixa">
        <h1>🔵 Página de Serviços</h1>
        <p>Estou dentro da pasta <strong>servicos</strong> — mas não uso <code>../</code>!</p>
        <hr>

        <!-- ✅ VOLTAR → endereço completo direto à raiz -->
        <button class="voltar" onclick="irPara('https://seu-dominio.com/index.html')">
            ⬅ Voltar à Página Inicial
        </button>

        <!-- ✅ IR PARA CONTATO → endereço completo direto -->
        <button class="contato" onclick="irPara('https://seu-dominio.com/contato/formulario.html')">
            📬 Ir para Contato
        </button>
    </div>

    <script>
        function irPara(endereco) {
            window.location.href = endereco;
        }
    </script>

</body>
</html>
