<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sobre Nós</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 40px auto; padding: 20px; background: #fff8e1; }
        .caixa { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #e65100; text-align: center; }
        button { padding: 12px 24px; margin: 8px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { transform: translateY(-2px); }
        .voltar { background: #ffcc80; }
    </style>
</head>
<body>

    <div class="caixa">
        <h1>ℹ️ Sobre Nós</h1>
        <p>Página com endereço completo — simples e seguro!</p>
        <hr>

        <button class="voltar" onclick="irPara('https://seu-dominio.com/index.html')">
            ⬅ Voltar à Página Inicial
        </button>
    </div>

    <script>
        function irPara(endereco) {
            window.location.href = endereco;
        }
    </script>

</body>
</html>
